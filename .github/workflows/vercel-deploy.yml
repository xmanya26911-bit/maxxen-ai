name: Debounced Vercel Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: vercel-production-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait 15 minutes for changes to settle
        run: sleep 900

      - name: Verify this is still the latest main commit
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "event_sha=${GITHUB_SHA}"
          echo "latest_sha=${latest_sha}"

          if [ "$latest_sha" != "${GITHUB_SHA}" ]; then
            echo "A newer commit exists. Skipping this deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy latest main to Vercel
        if: steps.latest.outputs.deploy == 'true'
        run: npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
